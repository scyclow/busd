import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.1/dist/transformers.min.js';


class LegalChatbot {
    constructor(legalText, systemPrompt) {
        this.legalText = legalText;
        this.systemPrompt = systemPrompt;
        this.chunks = this.splitIntoChunks(legalText);
        this.chunkEmbeddings = [];
        this.embedder = null;
        this.generator = null;
    }

    async init() {
        // Set transformers.js to use wasm (or webgl/webgpu if supported)
        env.backends.onnx.wasm.numThreads = 1; // Adjust for performance

        // Load embedding and generation models
        this.embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        this.generator = await pipeline('text-generation', 'Xenova/distilgpt2');

        // Precompute embeddings for each chunk
        for (let chunk of this.chunks) {
            const emb = await this.getEmbedding(chunk);
            this.chunkEmbeddings.push(emb);
        }
    }

    splitIntoChunks(text, chunkSize = 300) {
        const words = text.split(/\s+/);
        const chunks = [];
        for (let i = 0; i < words.length; i += chunkSize) {
            chunks.push(words.slice(i, i + chunkSize).join(' '));
        }
        return chunks;
    }

    async getEmbedding(text) {
        const output = await this.embedder(text, { pooling: 'mean', normalize: true });
        return output.data;  // Float32Array
    }

    cosineSimilarity(vecA, vecB) {
        let dot = 0, magA = 0, magB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dot += vecA[i] * vecB[i];
            magA += vecA[i] * vecA[i];
            magB += vecB[i] * vecB[i];
        }
        return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    async askQuestion(question) {
        const qEmbedding = await this.getEmbedding(question);

        const similarities = this.chunkEmbeddings.map(emb => this.cosineSimilarity(qEmbedding, emb));

        // Get top 2 most similar chunks
        const topIndices = similarities
            .map((sim, idx) => ({ sim, idx }))
            .sort((a, b) => b.sim - a.sim)
            .slice(0, 2)
            .map(obj => obj.idx);

        const context = topIndices.map(idx => this.chunks[idx]).join('\n\n');

        const prompt = `${this.systemPrompt}\n\nContext:\n${context}\n\nQuestion: ${question}\nAnswer:`;

        const output = await this.generator(prompt, {
            max_new_tokens: 100,
            temperature: 0.7,
            top_p: 0.9
        });

        return output[0].generated_text.slice(prompt.length).trim();
    }


}
